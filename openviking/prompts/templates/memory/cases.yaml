memory_type: cases
description: |
  A Case represents a business domain, NOT an individual task, workflow or execution.
  Extract from a real user task with observable execution or outcome; skip chit-chat and
  fragments. Infer the business domain from the current service/task context. Group tasks
  within the same domain into one Case, and keep distinct business domains separate.
  Do not split a domain by workflow, rule check, eligibility condition, parameter, user,
  task ID or outcome. Those distinctions belong in the same-name Experience's conditional branches.

  Search for an existing domain-level Case and reuse its canonical name. A narrower workflow Case
  is not the domain identity; do not rename, delete or consolidate legacy Cases here.
  Refine domain and description only to clarify, correct or supplement the SAME business domain
  using supplied evidence. Never repurpose an existing Case into a different business domain;
  reuse or create another Case for that domain instead. Keep case_name unchanged.
  Maintain its rubric only from explicitly supplied evaluation or acceptance criteria, following
  the rubric field's source restrictions. A failed run is not permission to change the criteria.
  For each execution, increment execution_count once on every matched existing Case, even when
  its rubric and domain context are unchanged. In Python, use matched_case.update(execution_count=1)
  on the loaded Case; sdk.commit(cases=[...]) and sdk.commit() are not required. In JSON, include
  a Case update with its page_id, unchanged identity fields, and execution_count: 1.
  This update associates the execution with the Case so it can contribute a Trajectory;
  do not return an empty operation for a match.
  Update changed domain, description or rubric fields on the loaded Case using the normal
  edit/drop/overwrite field operations.
  Count only matched Cases, not all search results. Use sdk.create_cases only for a new domain
  target, never for an existing one, and set execution_count=1 for its first execution.
  When merging Case patches, sum their execution_count deltas once for each final Case rather
  than submitting 1 or a historical total. Case merging still requires its explicit case_sources mapping.
  Concrete task inputs, expected values, execution facts and scores belong to each Trajectory,
  not this memory. The Case describes the business scope; its Experience describes how to handle it.

  Write natural-language text in {{ language }}. Keep canonical domain identifiers unchanged;
  do not create translated duplicates. Preserve tool/API names, policy conditions and thresholds.

directory: "viking://user/{{ user_space }}/memories/cases"
filename_template: "{{ case_name }}.md"
enabled: true
peer_enabled: false
content_template: |
  # {{ case_name }}

  ## Domain
  {{ domain }}

  ## Description
  {{ description }}

  ## Rubric
  ```json
  {{ rubric }}
  ```

embedding_template: |-
  {{ case_name }}

  {{ domain }}

  {{ description }}

  {{ rubric }}
overview_template: |-
  # Cases Overview
  {% for item in items %}
  - [{{ item.file_content.case_name }}](./{{ item.file_name }}) — {{ item.file_content.domain }}
  {% endfor %}

fields:
  - name: case_name
    type: string
    description: |
      Stable business-domain identifier. For new domains use lowercase English snake_case,
      regardless of conversation language. Derive the name from the actual domain.
      Examples only, not prescribed identifiers or a fixed domain list: airline_customer_service,
      software_maintenance.
      Reuse an existing domain-level identifier. Never name a Case after a workflow, condition,
      processing result, task number or entity ID.
    merge_op: immutable

  - name: domain
    type: string
    description: |
      One sentence describing the business domain and its service scope, not one task's intent.
      Include the domain's range of services rather than a particular action or result.
      No dataset signatures or instance-specific identifiers, names, amounts, dates or paths.
    merge_op: patch

  - name: description
    type: string
    description: |
      A short Case introduction: stable background and context needed to understand this domain.
      Use concise prose or Markdown bullets, not JSON. Do not repeat domain or rubric,
      copy entire policy/tool manuals, or include task-specific identifiers, dates, amounts,
      membership tiers or other instance values. Original rules belong in each Trajectory.
    merge_op: patch

  - name: execution_count
    type: int64
    description: |
      Number of executions associated with this Case. Submit a delta of 1 per matched execution,
      including the first execution when creating a Case, even if no other fields change.
      Do not count unmatched search candidates. Submit only the increment, never the historical
      total. When merging patches, sum the contributing execution_count deltas once.
    merge_op: sum

  - name: rubric
    type: string
    init_value: "[]"
    description: |
      JSON list of domain-wide evaluation criteria, each with exactly id and description strings.
      Extract only explicit external rubrics, evaluation/acceptance criteria defined in context,
      or success conditions explicitly stated by the user.
      Normalize wording and deduplicate without changing meaning, conditions, thresholds or scope.
      Do not infer criteria from ordinary business rules, tool descriptions, outcomes/errors,
      Experience advice or assistant reasoning. Existing memories alone are not authority.
      Only explicit definitions may authorize adding, changing or removing criteria; keep stable IDs.
      Without explicit new definitions, leave an existing rubric unchanged; use [] for a new Case.
      Keep task-specific answers, identifiers and scores in Trajectories, not domain-wide criteria.
      Example shape only: [{"id":"respect_scope","description":"Only perform changes the user authorized."}]
      Each Trajectory evaluates these criteria and stores its own definition/result snapshot.
    merge_op: patch
